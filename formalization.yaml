# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml (v0.4): repo-root metadata for this formalization,
# following https://github.com/mathlib-initiative/formalization.yaml

version: "v0.4"

project:
  name: "elliptic-reduction"
  description: >-
    Planned Lean 4 / Mathlib formalization of general reduction theory for elliptic curves, the theory
    behind IUT IV Proposition 1.8(v)-(vii): semistable and Néron models, moduli with level structure,
    inertia actions, Galois descent for elliptic curves, and Serre-type criteria via polarized abelian varieties
    and Tate modules.
    The repository is currently an empty scaffold: no definitions or theorems yet.
  authors:
    - "Claude (Anthropic)"
    - "LANA Project"
  responsible_maintainers:
    - "Christian Merten"
  license: "Apache-2.0"

sources:
  - title: "Inter-universal Teichmüller Theory IV: Log-volume Computations and Set-theoretic Foundations"
    authors: ["Shinichi Mochizuki"]
    id: "Publ. Res. Inst. Math. Sci. 57 (2021), 627-723"
    type: "article"
    location: "Proposition 1.8(v)-(vii)"
    note: "Named in the README goals (the README has no sources section); nothing is formalised yet."

related_formalizations:
  - id: "https://github.com/lana-agents/iut"
    relationship: "other"
    note: "Planned to discharge reduction-theory inputs of iut; iut does not use it."
  - id: "https://github.com/lana-agents/elliptic-curves"
    relationship: "other"
    note: "Overlapping scope (Néron–Ogg–Shafarevich direction, formal group, Weil pairing, Tate module, j-invariant criteria)."
  - id: "https://github.com/lana-agents/tate-curves-theta"
    relationship: "other"
    note: "Distinct: Tate uniformization and the theta function."

classification:
  arxiv: ["math.NT", "math.AG"]
  msc2020: ["11G07", "14H52", "14G20"]

status:
  scope: "not started (scaffold only)"
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results: []

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        orchestra for running the agents, taxis for project management, and Claude (Claude Code) as the
        coding agent; Lean/Lake builds with `lake build --wfail`.
      prompting_notes: >-
        Human input consisted of high-level task descriptions and scope decisions.
  notes: >-
    Agents were run with orchestra; project management (issues, status) was done in taxis;
    Claude was the coding agent.

fidelity:
  divergences: "None yet: nothing has been formalised."

review:
  status: "agent-reviewed"
  reviewers: ["Claude (Anthropic)"]
  notes: >-
    The formalization has only been reviewed by Claude; it has not been reviewed by a human.
    The repository is an empty scaffold (a placeholder module with no declarations), so there is
    nothing to check yet.

acknowledgements: "Built on Mathlib (Apache-2.0)."
